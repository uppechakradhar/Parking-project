<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Smart Parking System{% endblock %}</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top glass-nav">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
      <i class="bi bi-p-circle-fill me-1"></i> SmartPark <span class="text-accent">ANPR</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-grid-1x2 me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('entry_gate') }}"><i class="bi bi-box-arrow-in-right me-1"></i>Entry Gate</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('exit_gate') }}"><i class="bi bi-box-arrow-right me-1"></i>Exit Gate</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('slots_page') }}"><i class="bi bi-layout-text-window me-1"></i>Slots</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('records_page') }}"><i class="bi bi-clock-history me-1"></i>Records</a></li>
      </ul>
    </div>
  </div>
</nav>

<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index: 2000;"></div>

<main class="container-fluid px-3 px-md-4 py-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
function showToast(message, type = "success") {
  const id = "t" + Date.now();
  const icon = type === "success" ? "bi-check-circle-fill" : (type === "error" ? "bi-x-circle-fill" : "bi-info-circle-fill");
  const html = `
    <div id="${id}" class="toast align-items-center text-bg-${type === 'error' ? 'danger' : (type === 'info' ? 'info' : 'success')} border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body"><i class="bi ${icon} me-2"></i>${message}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>`;
  document.getElementById("toast-container").insertAdjacentHTML("beforeend", html);
  const el = document.getElementById(id);
  const toast = new bootstrap.Toast(el, { delay: 4000 });
  toast.show();
  el.addEventListener("hidden.bs.toast", () => el.remove());
}
function fmtMoney(n) { return "₹" + Number(n || 0).toFixed(2); }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
